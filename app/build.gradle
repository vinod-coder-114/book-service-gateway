plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux:5.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.1.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
