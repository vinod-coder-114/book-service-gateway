services:
  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: Dockerfile
    image: api-gateway:local
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
    networks:
      - bookstore-net

networks:
  bookstore-net:
    external: true
    name: user-service_bookstore-net

