server:
  port: 8080

spring:
  application:
    name: book-store-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://user-service:8081}
              predicates:
                - Path=/book-store/api/user/**
              filters:
                - RewritePath=/book-store/(?<segment>.*), /$\{segment}
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
              predicates:
                  - Path=/book-store/api/catalog/**
              filters:
                  -  RewritePath=/book-store/(?<segment>.*), /$\{segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://user-service:8081/.well-known/jwks.json

app:
  cors:
    allowed-origin-patterns:
      - ${ALLOWED_ORIGIN_PATTERNS:*}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Location
      - X-Correlation-Id
    allow-credentials: false
    max-age: PT30M
